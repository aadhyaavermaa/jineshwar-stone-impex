<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Request a consultation | Jineshwar Stone Impex</title>
    <meta
      name="description"
      content="Request a consultation at Jineshwar Stone Impex. Explore natural stone, architectural furniture and marble handicrafts."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script defer src="/js/main.js"></script>
    <script defer src="/js/enquiries.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main" tabindex="-1">
      <div class="page-head">
        <div class="wrap">
          <div class="eyebrow">Enquiry desk</div>
          <h1>Request a consultation</h1>
          <p class="intro">
            Tell us about your project and the material decisions you would like to discuss.
          </p>
        </div>
      </div>
      <section class="wrap section twocol">
        <div class="formbox">
          <h2>Project details</h2>
          <form id="request" class="formgrid" style="margin-top: 1.5rem">
            <label
              >Customer name<input
                type="text"
                name="customer_name"
                required
                maxlength="100"
                autocomplete="name" /></label
            ><label
              >Email address<input
                type="email"
                name="email"
                required
                maxlength="254"
                autocomplete="email" /></label
            ><label
              >Phone number<input
                type="tel"
                name="phone"
                required
                maxlength="30"
                minlength="7"
                autocomplete="tel" /></label
            ><label
              >Project type<select name="project_type" required>
                <option value="">Choose an option</option>
                <option value="Residential">Residential</option>
                <option value="Commercial">Commercial</option>
              </select></label
            ><label
              >Required service<select name="required_service" required>
                <option value="">Choose an option</option>
                <option value="Indian marble blocks & slabs">Indian marble blocks & slabs</option>
                <option value="Stone handicraft export">Stone handicraft export</option>
                <option value="Handicrafts for interiors & hospitality">
                  Handicrafts for interiors & hospitality
                </option>
                <option value="Stone sourcing consultancy">Stone sourcing consultancy</option>
                <option value="One-of-one architectural pieces">
                  One-of-one architectural pieces
                </option>
              </select></label
            ><label
              >Preferred material<input
                type="text"
                name="preferred_material"
                required
                maxlength="100"
                placeholder="e.g. Marble or undecided" /></label
            ><label
              >Approximate project budget<input
                type="text"
                name="budget"
                required
                maxlength="100"
                placeholder="Amount and currency, or undecided" /></label
            ><label
              >Preferred consultation date<input
                type="date"
                name="preferred_date"
                required /></label
            ><label class="wide"
              >Project description<textarea name="message" maxlength="3000" required></textarea>
            </label>
            <div class="wide"><button class="btn">Submit request</button></div>
          </form>
          <div id="response" aria-live="polite"></div>
        </div>
        <aside class="surface stack">
          <div class="eyebrow">Project desk</div>
          <h3>Planning your consultation</h3>
          <p>
            Your preferred date is a request. The studio will confirm arrangements during follow-up.
          </p>
          <a class="textlink" href="/services.html">Explore services</a>
        </aside>
      </section>
    </main>
    <footer class="foot" id="site-footer"></footer>
  </body>
</html>
