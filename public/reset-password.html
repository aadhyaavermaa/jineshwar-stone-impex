<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset password | Jineshwar Stone Impex</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/customer.css" />
    <script defer src="/js/main.js"></script>
    <script defer src="/js/customer-common.js"></script>
    <script defer src="/js/customer-password-reset.js"></script>
  </head>
  <body class="auth-screen">
    <div id="site-header"></div>
    <main id="main" tabindex="-1" class="auth-page">
      <div class="auth-panel">
        <figure class="auth-art">
          <img src="/images/interior.webp" alt="Illustrative architectural stone interior" />
          <figcaption><span>Jineshwar</span> Stone Impex</figcaption>
        </figure>
        <section class="auth-copy" aria-labelledby="auth-title">
          <h1 id="auth-title">Reset your password</h1>
          <p>Choose a new password with at least 10 characters.</p>
          <form id="password-reset" class="account-form" data-mode="reset" method="post">
            <div class="auth-field">
              <label for="password">New password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required />
            </div>
            <div class="auth-field">
              <label for="confirm-password">Confirm new password</label>
              <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required />
            </div>
            <button class="btn" type="submit" disabled>Save new password</button>
          </form>
          <p class="account-feedback" role="status" id="reset-feedback"></p>
          <p class="auth-switch"><a href="/forgot-password.html">Request a new link</a></p>
          <p class="auth-switch"><a href="/login.html">Back to sign in</a></p>
        </section>
      </div>
    </main>
    <footer id="site-footer" class="foot"></footer>
  </body>
</html>
