<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stone gallery | Jineshwar Stone Impex</title>
    <meta
      name="description"
      content="Stone gallery at Jineshwar Stone Impex. Explore natural stone, architectural furniture and marble handicrafts."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script defer src="/js/main.js"></script>
    <script defer src="/js/gallery.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main" tabindex="-1">
      <div class="page-head">
        <div class="wrap">
          <div class="eyebrow">The gallery</div>
          <h1>Objects & interiors</h1>
          <p class="intro">
            An illustrative image archive of finishes, carved forms and architectural applications.
          </p>
        </div>
      </div>
      <section class="wrap section">
        <div class="chips" id="chips"></div>
        <div class="gallery-grid" id="gallery"></div>
        <div class="actions">
          <a class="textlink" href="https://www.instagram.com/jineshwarstoneimpex/"
            >Visit the studio on Instagram</a
          >
        </div>
      </section>
      <dialog id="viewer" aria-labelledby="caption">
        <img id="large" alt="" />
        <div class="tools">
          <button class="outline" id="previous">Previous</button>
          <p id="caption" aria-live="polite"></p>
          <button class="outline" id="following">Next</button
          ><button class="btn" id="close">Close</button>
        </div>
      </dialog>
    </main>
    <footer class="foot" id="site-footer"></footer>
  </body>
</html>
