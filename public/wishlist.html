<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your wishlist | Jineshwar Stone Impex</title>
    <meta
      name="description"
      content="Your wishlist at Jineshwar Stone Impex. Explore natural stone, architectural furniture and marble handicrafts."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script defer src="/js/main.js"></script>
    <script defer src="/js/products.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main" tabindex="-1">
      <div class="page-head">
        <div class="wrap">
          <div class="eyebrow">Material library</div>
          <h1>Your wishlist</h1>
          <p class="intro">
            Save materials for your next project. Sign in to keep your shortlist
            across devices.
          </p>
        </div>
      </div>
      <section class="wrap section">
        <div class="listing-tools">
          <p class="results" id="count" aria-live="polite"></p>
          <a class="textlink" href="/brochure.html?from=wishlist"
            >Create my brochure</a
          >
        </div>
        <div id="listing" class="cards">
          <div class="skeleton" aria-label="Loading materials"></div>
        </div>
      </section>
    </main>
    <footer class="foot" id="site-footer"></footer>
  </body>
</html>
