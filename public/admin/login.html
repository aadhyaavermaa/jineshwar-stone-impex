<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Jineshwar Stone Impex administrator workspace" />
    <title>Administrator sign-in | Jineshwar Stone Impex</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/main.js" defer></script>
    <script src="/js/admin.js" defer></script>
  </head>
  <body class="staff staff-login">
    <main class="login-panel">
      <div class="login-photo">
        <img src="/images/interior.webp" alt="Illustrative green stone interior" />
      </div>
      <div class="login-fields">
        <div class="eyebrow">Jineshwar Stone Impex</div>
        <h1>Studio sign-in</h1>
        <form class="stack" id="login" method="post">
          <label
            >Username<input
              name="username"
              autocomplete="username"
              maxlength="80"
              required /></label
          ><label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="72"
              required /></label
          ><button class="btn" type="submit" disabled>Sign in</button>
        </form>
        <p aria-live="polite" id="feedback"></p>
        <a class="textlink" href="/">Return to catalogue</a>
      </div>
    </main>
  </body>
</html>
