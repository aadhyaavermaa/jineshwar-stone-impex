<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create your account | Jineshwar Stone Impex</title>
    <meta
      name="description"
      content="Keep your stone selections, projects and requests in one place."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/customer.css" />
    <script defer src="/js/main.js"></script>
    <script defer src="/js/customer-common.js"></script>
    <script defer src="/js/customer-login.js"></script>
  </head>
  <body class="auth-screen">
    <div id="site-header"></div>
    <main id="main" tabindex="-1" class="auth-page">
      <div class="auth-panel">
        <figure class="auth-art">
          <img src="/images/hero.webp" alt="Illustrative architectural stone interior" />
          <figcaption><span>Jineshwar</span> Stone Impex</figcaption>
        </figure>
        <section class="auth-copy" aria-labelledby="auth-title">
          <div class="eyebrow">Customer account</div>
          <h1 id="auth-title">Create your account</h1>
          <p>Keep your stone selections, projects and requests in one place.</p>
          <form id="customer-auth" class="account-form" data-mode="signup">
            <div class="auth-field">
              <label for="name">Full name</label>
              <input
                id="name"
                name="name"
                type="text"
                required
                maxlength="100"
                autocomplete="name"
              />
            </div>
            <div class="auth-field">
              <label for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                required
                maxlength="254"
                autocomplete="email"
              />
            </div>
            <div class="auth-field auth-field--wide">
              <label for="phone">Phone number</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                required
                maxlength="30"
                autocomplete="tel"
              />
            </div>
            <div class="auth-field">
              <label for="password">Password</label>
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  aria-describedby="strength-label"
                  minlength="10"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-controls="password"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
            </div>
            <div class="auth-field">
              <label for="confirm_password">Confirm password</label>
              <div class="password-field">
                <input
                  id="confirm_password"
                  name="confirm_password"
                  type="password"
                  autocomplete="new-password"
                  minlength="10"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-controls="confirm_password"
                  aria-label="Show confirm password"
                >
                  Show
                </button>
              </div>
            </div>
            <div class="pw-meter">
              <meter id="strength" min="0" max="4" value="0" aria-label="Password strength"></meter
              ><small id="strength-label">Use at least 10 characters.</small>
            </div>
            <p class="account-feedback" role="status" id="auth-feedback"></p>
            <button class="btn" type="submit" id="auth-submit" disabled>Create an account</button>
          </form>
          <div id="google-area" hidden>
            <div class="or-rule"><span>or</span></div>
            <div id="google-button"></div>
          </div>
          <p class="auth-switch">
            Already have an account? <a id="auth-switch" href="/login.html">Sign in</a>
          </p>
        </section>
      </div>
    </main>
    <footer id="site-footer" class="foot"></footer>
  </body>
</html>
